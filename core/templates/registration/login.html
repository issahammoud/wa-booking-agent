{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <div class="mx-auto mt-16 max-w-sm">
    <h1 class="mb-6 text-center text-2xl font-semibold text-gray-900">Sign in</h1>
    <form method="post" class="space-y-4 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
      {% csrf_token %}
      {% if form.errors %}
        <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">
          Your username and password didn't match. Please try again.
        </p>
      {% endif %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" name="username" id="id_username" autofocus required
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" id="id_password" required
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500">
      </div>
      <button type="submit"
        class="w-full rounded-md bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700">
        Sign in
      </button>
    </form>
  </div>
{% endblock %}
