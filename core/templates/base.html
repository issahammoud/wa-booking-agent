{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-gray-50">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Booking Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="h-full font-sans text-gray-900 antialiased">
    {% if user.is_authenticated %}
      <nav class="border-b border-gray-200 bg-white">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
          <div class="flex items-center gap-6">
            <span class="text-lg font-semibold text-brand-700">Booking Dashboard</span>
            <a href="{% url 'dashboard-home' %}" class="text-sm font-medium text-gray-600 hover:text-brand-600">Dashboard</a>
            <a href="{% url 'conversation-list' %}" class="text-sm font-medium text-gray-600 hover:text-brand-600">Conversations</a>
            <a href="{% url 'integrations' %}" class="text-sm font-medium text-gray-600 hover:text-brand-600">Integrations</a>
          </div>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-sm font-medium text-gray-500 hover:text-gray-800">Log out</button>
          </form>
        </div>
      </nav>
    {% endif %}
    <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
