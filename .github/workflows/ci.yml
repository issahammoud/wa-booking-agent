name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wa_booking_agent
          POSTGRES_USER: wa_booking_agent
          POSTGRES_PASSWORD: wa_booking_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wa_booking_agent -d wa_booking_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://wa_booking_agent:wa_booking_agent@localhost:5432/wa_booking_agent
      REDIS_URL: redis://localhost:6379/0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-verify-token
      WHATSAPP_APP_SECRET: ci-app-secret
      OPENROUTER_API_KEY: ci-openrouter-key
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_OAUTH_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_OAUTH_CLIENT_SECRET: ci-microsoft-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
